name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output (out)
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ runner.os }}-${{ runner.arch }}
          path: out/**

      - name: Sync version from tag (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('node:fs');const tag=(process.env.GITHUB_REF_NAME||'').replace(/^v/,'');if(!tag){throw new Error('missing GITHUB_REF_NAME');}const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.version=tag;fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');console.log('Set package.json version ->',tag);"

      - name: Build installers (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --no-install electron-builder --publish never

      - name: Upload release assets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/**/*.exe
            dist/release/**/*.exe.blockmap
            dist/release/**/*.dmg
            dist/release/**/*.zip
            dist/release/**/*.zip.blockmap
            dist/release/**/*.AppImage
            dist/release/**/*.AppImage.blockmap
            dist/release/latest*.yml

  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
